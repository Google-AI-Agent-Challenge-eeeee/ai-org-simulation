version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_org_simulation
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
