[project]
name = "ai-org-simulation"
version = "0.1.0"
description = "AI-based virtual organization simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "scripts"]
extend-exclude = [
    ".venv",
    "frontend",
    "datasets",
    "infra",
    "backend/db/migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 표준 패턴: `param: T = Query(...)`, `db: Session = Depends(...)` 같이
# 함수 호출을 기본값으로 두는 것이 의도된 API. B008이 이걸 잡지 않도록 화이트리스트.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra -q"
# Marker filtering is done in ``justfile`` recipes (``just test`` excludes
# integration, ``just test-integration`` includes only it). Keep this file
# free of marker defaults so plain ``pytest`` runs everything.
markers = [
    "integration: requires a running Postgres seeded by ``just seed``.",
]
