name: CI

# What triggers a run:
# - push: any branch -> lint + unit. Cheap sanity for every commit.
# - pull_request -> develop: lint + unit + integration. Full check before merge.
on:
  push:
    branches-ignore: []
  pull_request:
    branches: [develop]

# Cancel superseded runs on the same ref so a force-push doesn't waste minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python deps
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  unit:
    name: Unit tests (no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python deps
        run: uv sync --frozen
      - name: pytest (unit only)
        run: uv run pytest -m "not integration"

  integration:
    name: Integration tests (Postgres + seed)
    # PR-only: integration tests need a live Postgres + seed, more expensive
    # than per-push lint/unit. Pre-merge is the right place to gate them.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_org_simulation
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Health check so the job waits until Postgres actually accepts connections.
        options: >-
          --health-cmd "pg_isready -U user -d ai_org_simulation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Match docker-compose.yml so local + CI use the same URL shape.
      DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/ai_org_simulation
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python deps
        run: uv sync --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Seed dummy data
        run: uv run python scripts/dev/seed_all.py
      - name: pytest (integration)
        run: uv run pytest -m integration
